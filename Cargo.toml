[workspace]
resolver = "2"
members = ["crates/lichtung-clock", "crates/lichtung-log", "crates/lichtung-core", "crates/lichtung-prod"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/braidword/lichtung"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
jsonschema = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
criterion = "0.5"
